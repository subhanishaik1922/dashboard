<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B11" />
      <stop offset="50%" stop-color="#111726" />
      <stop offset="100%" stop-color="#0A0D15" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0016EC" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#0016EC" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)" rx="24" />
  
  <!-- Outer Border -->
  <rect x="36" y="36" width="1128" height="828" rx="16" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-dasharray="10 5" opacity="0.6" />
  <rect x="52" y="52" width="1096" height="796" rx="12" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.1" />

  <!-- Corner Flourishes -->
  <circle cx="52" cy="52" r="7" fill="#0016EC" />
  <circle cx="1148" cy="52" r="7" fill="#0016EC" />
  <circle cx="52" cy="848" r="7" fill="#0016EC" />
  <circle cx="1148" cy="848" r="7" fill="#0016EC" />

  <!-- Top Badge -->
  <rect x="420" y="90" width="360" height="42" rx="21" fill="#0016EC" fill-opacity="0.15" stroke="#0016EC" stroke-width="1.5" />
  <text x="600" y="117" fill="#E2E8F0" font-size="13" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="4" text-anchor="middle">
    ELITE ONLINE CERTIFICATION
  </text>

  <!-- Issuing Body -->
  <text x="600" y="190" fill="#94A3B8" font-size="18" font-family="'Inter', sans-serif" font-weight="600" letter-spacing="3" text-anchor="middle">
    NPTEL & SWAYAM • IIT KHARAGPUR
  </text>

  <!-- Verification Statement -->
  <text x="600" y="275" fill="#CBD5E1" font-size="20" font-family="'Inter', sans-serif" font-style="italic" text-anchor="middle">
    This credential is proudly awarded to
  </text>

  <!-- Recipient Name -->
  <text x="600" y="355" fill="#FFFFFF" font-size="44" font-family="'Inter', sans-serif" font-weight="900" letter-spacing="2" text-anchor="middle">
    MAHABOOB SUBHANI SHAIK
  </text>

  <!-- Divider Line -->
  <line x1="420" y1="395" x2="780" y2="395" stroke="#0016EC" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="600" cy="395" r="5" fill="#0016EC" />

  <!-- Accomplishment Context -->
  <text x="600" y="455" fill="#94A3B8" font-size="18" font-family="'Inter', sans-serif" text-anchor="middle">
    for the distinguished completion and verification of
  </text>

  <!-- Course / Program Title -->
  <text x="600" y="530" fill="#38BDF8" font-size="34" font-family="'Inter', sans-serif" font-weight="800" letter-spacing="-0.5" text-anchor="middle">
    Cloud Computing
  </text>

  <!-- Subtitle -->
  <text x="600" y="580" fill="#94A3B8" font-size="19" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    12-Week Intensive National Examination (Jan - Apr 2023)
  </text>

  <!-- Bottom Section Box -->
  <rect x="90" y="670" width="1020" height="120" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" />

  <!-- Authority Info -->
  <g transform="translate(130, 715)">
    <text x="0" y="18" fill="#FFFFFF" font-size="16" font-family="'Inter', sans-serif" font-weight="700">
      Indian Institute of Technology Kharagpur
    </text>
    <text x="0" y="44" fill="#64748B" font-size="13" font-family="'Inter', sans-serif" font-weight="500" letter-spacing="1">
      OFFICIAL CREDENTIAL • VERIFIED RECORD
    </text>
  </g>

  <!-- Official Seal Symbol -->
  <g transform="translate(1000, 730)">
    <circle cx="0" cy="0" r="32" fill="#0016EC" fill-opacity="0.25" stroke="#0016EC" stroke-width="2" />
    <path d="M-10 -4 L-3 6 L11 -8" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>